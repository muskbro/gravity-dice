<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gravity Dice</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f4ead3'/%3E%3Ccircle cx='20' cy='20' r='6' fill='%231b1612'/%3E%3Ccircle cx='44' cy='20' r='6' fill='%231b1612'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%231b1612'/%3E%3Ccircle cx='20' cy='44' r='6' fill='%231b1612'/%3E%3Ccircle cx='44' cy='44' r='6' fill='%231b1612'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div class="hud">
        <aside class="panel left">
          <p class="kicker">Gravity simulator</p>
          <h1>Gravity Dice</h1>
          <p class="lede">
            Toss a die in a felt tray and watch gravity decide the bounce, tumble, and face that lands up.
          </p>

          <section>
            <div class="label-row">
              <span>Gravity</span>
              <strong id="g-readout">9.81 m/s²</strong>
            </div>
            <input id="g-slider" type="range" min="0" max="25" step="0.01" value="9.81" />
            <div class="presets" id="presets"></div>
          </section>

          <section>
            <div class="label-row"><span>Dice in the tray</span></div>
            <div class="stepper">
              <button id="dice-minus" type="button" aria-label="Fewer dice">−</button>
              <span id="dice-count">2</span>
              <button id="dice-plus" type="button" aria-label="More dice">+</button>
            </div>
          </section>

          <section class="toggles">
            <label class="toggle">
              <input id="slow-mo" type="checkbox" />
              Slow motion
            </label>
            <label class="toggle">
              <input id="dust" type="checkbox" checked />
              Falling dust (shows g)
            </label>
          </section>

          <button id="roll" class="roll" type="button">Roll</button>
          <p class="hint">Space to roll · drag to orbit the tray</p>
        </aside>

        <div></div>

        <aside class="panel right">
          <p class="kicker">Telemetry</p>
          <div id="telemetry">Waiting for toss…</div>
          <div id="result" class="result idle">
            <span class="result-label">Awaiting roll</span>
            <div class="faces" id="faces"></div>
            <div class="sum" id="sum"></div>
            <p class="flavor" id="flavor"></p>
          </div>
        </aside>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
